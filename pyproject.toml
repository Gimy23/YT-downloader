[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ytdl"
version = "1.0.0"
description = "A professional, lightweight, cross-platform CLI media downloader"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "yt-dlp>=2024.3.10",
    "typer>=0.9.0",
    "rich>=13.0.0",
    "questionary>=2.0.0",
    "click>=8.0.0",
]

[project.scripts]
ytdl = "ytdl.main:run_cli"

[tool.setuptools.packages.find]
where = ["src"]
